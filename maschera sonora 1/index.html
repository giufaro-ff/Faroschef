<title>Maschera Sonora</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #9d9d9c; }
#container {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; position: relative;
}
#container svg { width: 100%; height: 100%; max-height: 100vh; }
#micButton {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  padding: 16px 40px; font-size: 18px; font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #1d1d1b; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; letter-spacing: 0.5px; transition: opacity 0.3s, transform 0.2s;
  z-index: 10;
}
#micButton:hover { opacity: 0.85; transform: translateX(-50%) scale(1.03); }
#micButton:active { transform: translateX(-50%) scale(0.97); }
#micButton:disabled { opacity: 0.3; cursor: not-allowed; }
#status {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
  font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px;
  color: #1d1d1b; opacity: 0; transition: opacity 0.4s; z-index: 10;
  text-align: center; background: rgba(255,255,255,0.6); padding: 8px 16px;
  border-radius: 6px;
}
#status.visible { opacity: 1; }
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  color: #fff;
  font-size: 22px;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s;
}
.back-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.12);
}
</style>
</head>

<script>
const SAMPLE_POINTS = 40
const VIBRATION_SCALE = 6

let audioCtx = null
let analyser = null
let source = null
let stream = null
let animating = false
let noisePhase = 0
let talkPhase = 0
let lowSmoothed = 0, midSmoothed = 0, highSmoothed = 0, totalSmoothed = 0
let mouthOpenness = 0, linearOpenness = 0

const mouthEl = document.getElementById('mouth')
const eyelid1El = document.getElementById('eyelid1')
const eyelid2El = document.getElementById('eyelid2')
const eyeLeftEl = document.getElementById('eyeLeft')
const eyeRightEl = document.getElementById('eyeRight')
const eyelineEls = [
  document.getElementById('eyeline1'),
  document.getElementById('eyeline2'),
  document.getElementById('eyeline3'),
  document.getElementById('eyeline4')
]
const noseEls = [
  document.getElementById('nose1'),
  document.getElementById('nose2')
]
const micButton = document.getElementById('micButton')
const statusEl = document.getElementById('status')
const closedPathEl = document.getElementById('closedMouthPath')
const openPathEl = document.getElementById('openMouthPath')

let cachedClosedPts = []
let cachedOpenPts = []
let cachedClosedEyelid = [[], []]
let cachedOpenEyelid = [[], []]
let cachedClosedEyes = [[], []]
let cachedOpenEyes = [[], []]
let cachedClosedEyelines = [[], [], [], []]
let cachedOpenEyelines = [[], [], [], []]
let cachedClosedNose = [[], []]
let cachedOpenNose = [[], []]

function samplePath(pathEl, n) {
  const len = pathEl.getTotalLength()
  const pts = []
  for (let i = 0; i < n; i++) {
    const pt = pathEl.getPointAtLength((i / (n - 1)) * len)
    pts.push({ x: pt.x, y: pt.y })
  }
  return pts
}

function interpolatePoints(closed, open, t) {
  return closed.map((p, i) => ({
    x: p.x + (open[i].x - p.x) * t,
    y: p.y + (open[i].y - p.y) * t
  }))
}

function addVibrations(pts, intensity, jitter, phase) {
  const scale = intensity * VIBRATION_SCALE
  return pts.map((p, i) => {
    const angle = phase + i * 0.5 + jitter * i * 0.1
    const dx = Math.sin(angle) * scale + (Math.random() - 0.5) * jitter * 2
    const dy = Math.cos(angle * 1.3) * scale + (Math.random() - 0.5) * jitter * 2
    return { x: p.x + dx, y: p.y + dy }
  })
}

function pointsToPath(pts) {
  const n = pts.length
  let d = `M${pts[0].x},${pts[0].y}`
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n]
    const p1 = pts[i]
    const p2 = pts[(i + 1) % n]
    const p3 = pts[(i + 2) % n]
    const cp1x = p1.x + (p2.x - p0.x) / 6
    const cp1y = p1.y + (p2.y - p0.y) / 6
    const cp2x = p2.x - (p3.x - p1.x) / 6
    const cp2y = p2.y - (p3.y - p1.y) / 6
    d += `C${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`
  }
  d += 'Z'
  return d
}

function showStatus(msg, isError) {
  statusEl.textContent = msg
  statusEl.className = 'visible'
  if (isError) statusEl.style.color = '#c00'
  else statusEl.style.color = '#1d1d1b'
}

function hideStatus() {
  statusEl.className = ''
  statusEl.textContent = ''
}

function initPaths() {
  cachedClosedPts = samplePath(closedPathEl, SAMPLE_POINTS)
  cachedOpenPts = samplePath(openPathEl, SAMPLE_POINTS)

  const eyelidIds = ['Eyelid1', 'Eyelid2']
  cachedClosedEyelid = eyelidIds.map(id => samplePath(document.getElementById('closed' + id + 'Path'), SAMPLE_POINTS))
  cachedOpenEyelid = eyelidIds.map(id => samplePath(document.getElementById('open' + id + 'Path'), SAMPLE_POINTS))

  const eyeIds = ['EyeLeft', 'EyeRight']
  cachedClosedEyes = eyeIds.map(id => samplePath(document.getElementById('closed' + id + 'Path'), SAMPLE_POINTS))
  cachedOpenEyes = eyeIds.map(id => samplePath(document.getElementById('open' + id + 'Path'), SAMPLE_POINTS))

  const lineIds = ['Eyeline1', 'Eyeline2', 'Eyeline3', 'Eyeline4']
  cachedClosedEyelines = lineIds.map(id => samplePath(document.getElementById('closed' + id + 'Path'), SAMPLE_POINTS))
  cachedOpenEyelines = lineIds.map(id => samplePath(document.getElementById('open' + id + 'Path'), SAMPLE_POINTS))

  const noseIds = ['Nose1', 'Nose2']
  cachedClosedNose = noseIds.map(id => samplePath(document.getElementById('closed' + id + 'Path'), SAMPLE_POINTS))
  cachedOpenNose = noseIds.map(id => samplePath(document.getElementById('open' + id + 'Path'), SAMPLE_POINTS))
}

async function setupAudio() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 256
    source = audioCtx.createMediaStreamSource(stream)
    source.connect(analyser)
    micButton.textContent = '🎤 Microfono attivo'
    micButton.disabled = true
    hideStatus()
    if (!animating) {
      animating = true
      animate()
    }
  } catch (err) {
    showStatus('Impossibile accedere al microfono. Controlla le autorizzazioni e riprova.', true)
    micButton.textContent = '🎤 Riprova'
    micButton.disabled = false
    console.error('Mic error:', err)
  }
}

function animate() {
  if (!analyser) {
    requestAnimationFrame(animate)
    return
  }

  const data = new Uint8Array(analyser.frequencyBinCount)
  analyser.getByteFrequencyData(data)

  const n = data.length
  let lowSum = 0, midSum = 0, highSum = 0, totalSum = 0
  const lowEnd = Math.floor(n * 0.15)
  const midEnd = Math.floor(n * 0.5)
  for (let i = 0; i < n; i++) {
    totalSum += data[i]
    if (i < lowEnd) lowSum += data[i]
    else if (i < midEnd) midSum += data[i]
    else highSum += data[i]
  }
  const low = lowSum / lowEnd / 255
  const mid = midSum / (midEnd - lowEnd) / 255
  const high = highSum / (n - midEnd) / 255
  const total = totalSum / n / 255

  lowSmoothed += (low - lowSmoothed) * 0.35
  midSmoothed += (mid - midSmoothed) * 0.45
  highSmoothed += (high - highSmoothed) * 0.55
  totalSmoothed += (total - totalSmoothed) * 0.4

  const active = lowSmoothed > 0.03 || midSmoothed > 0.04

  // Mouth: driven by low + mid, asymmetric attack/decay
  const rawMouth = Math.min(1, lowSmoothed * 2.5 + midSmoothed * 1.2)
  if (rawMouth > mouthOpenness) {
    mouthOpenness += (rawMouth - mouthOpenness) * 0.7
  } else {
    mouthOpenness += (rawMouth - mouthOpenness) * 0.25
  }

  // Speech oscillation on mouth only
  if (active) {
    talkPhase += 0.04 + midSmoothed * 0.08
    const wobble = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(talkPhase))
    mouthOpenness *= wobble
  } else {
    talkPhase *= 0.95
  }

  // Other features: linear interpolation from total volume
  linearOpenness += (Math.min(1, totalSmoothed * 2.5) - linearOpenness) * 0.35

  noisePhase += 0.3 + midSmoothed * 0.5

  const features = [
    { pts: interpolatePoints(cachedClosedPts, cachedOpenPts, mouthOpenness), el: mouthEl, vib: 1 },
    { pts: interpolatePoints(cachedClosedEyelid[0], cachedOpenEyelid[0], linearOpenness), el: eyelid1El, vib: 0 },
    { pts: interpolatePoints(cachedClosedEyelid[1], cachedOpenEyelid[1], linearOpenness), el: eyelid2El, vib: 0 },
    { pts: interpolatePoints(cachedClosedEyes[0], cachedOpenEyes[0], linearOpenness), el: eyeLeftEl, vib: 0 },
    { pts: interpolatePoints(cachedClosedEyes[1], cachedOpenEyes[1], linearOpenness), el: eyeRightEl, vib: 0 },
  ]

  for (let i = 0; i < 4; i++) {
    features.push({ pts: interpolatePoints(cachedClosedEyelines[i], cachedOpenEyelines[i], linearOpenness), el: eyelineEls[i], vib: 0 })
  }
  for (let i = 0; i < 2; i++) {
    features.push({ pts: interpolatePoints(cachedClosedNose[i], cachedOpenNose[i], linearOpenness), el: noseEls[i], vib: 0 })
  }

  for (const f of features) {
    let pts = f.pts
    if (f.vib > 0 && mouthOpenness > 0.01) {
      pts = addVibrations(pts, mouthOpenness * f.vib, highSmoothed * f.vib, noisePhase)
    }
    f.el.setAttribute('d', pointsToPath(pts))
  }

  if (linearOpenness > 0.02) {
    eyeLeftEl.setAttribute('fill', '#e53935')
    eyeRightEl.setAttribute('fill', '#e53935')
  } else {
    eyeLeftEl.removeAttribute('fill')
    eyeRightEl.removeAttribute('fill')
  }

  requestAnimationFrame(animate)
}

micButton.addEventListener('click', () => {
  micButton.disabled = true
  micButton.textContent = '⏳ Richiesta in corso...'
  setupAudio()
})

initPaths()
animating = true
animate()
</script>
